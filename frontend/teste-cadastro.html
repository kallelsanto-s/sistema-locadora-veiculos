<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Cadastro de Veículos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>Cadastrar Veículo (Teste)</h2>
    
    <form id="formVeiculo">
        <div>
            <label>Marca:</label>
            <input type="text" id="marca" required placeholder="Ex: Volkswagen">
        </div>
        <div>
            <label>Modelo:</label>
            <input type="text" id="modelo" required placeholder="Ex: Saveiro">
        </div>
        <div>
            <label>Placa:</label>
            <input type="text" id="placa" required placeholder="Ex: KAL1234">
        </div>
        <div>
            <label>Categoria:</label>
            <select id="categoria">
                <option value="Hatch">Hatch</option>
                <option value="Sedã">Sedã</option>
                <option value="SUV">SUV</option>
                <option value="Picape">Picape</option>
            </select>
        </div>
        <div>
            <label>Valor da Diária (R$):</label>
            <input type="number" id="valor_diaria" step="0.01" required placeholder="Ex: 120.00">
        </div>
        <button type="submit">Enviar para o Banco de Dados 🚀</button>
    </form>

    <script>
        document.getElementById('formVeiculo').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            
            const dados = {
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                placa: document.getElementById('placa').value,
                categoria: document.getElementById('categoria').value,
                valor_diaria: parseFloat(document.getElementById('valor_diaria').value),
                status: 'Disponível'
            };

            try {
                
                const resposta = await fetch('http://localhost:3000/api/veiculos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    alert('Sucesso: ' + resultado.mensagem);
                    document.getElementById('formVeiculo').reset(); 
                } else {
                    alert('Erro do Servidor: ' + resultado.erro);
                }
            } catch (erro) {
                console.error(erro);
                alert('Erro ao conectar com o servidor backend.');
            }
        });
    </script>
</body>
</html>
